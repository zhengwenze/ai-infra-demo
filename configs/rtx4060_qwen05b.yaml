schema_version: "1.0"
name: rtx4060-qwen05b-concurrency
seed: 20260812

target:
  backend: vllm
  base_url: http://127.0.0.1:8000
  model: Qwen/Qwen2.5-0.5B-Instruct
  request_type: chat_completions
  timeout_seconds: 120.0

generation:
  temperature: 0.0
  top_p: 1.0
  max_output_tokens: 128
  ignore_eos: false

workload:
  type: synthetic
  prompt_tokens: 1024
  output_tokens: 128
  num_requests: 100
  arrival:
    mode: concurrency
    values: [1, 2, 4, 8]

warmup:
  requests: 5
  include_in_metrics: false

telemetry:
  vllm_metrics_url: http://127.0.0.1:8000/metrics
  gpu_index: 0
  interval_ms: 500

validation:
  min_success_rate: 0.99
  output_token_tolerance_ratio: 0.10
  token_count_mismatch_ratio: 0.02
  max_client_loop_lag_ms: 20.0
  require_clean_gpu: true

slo:
  ttft_p95_ms: 500.0
  tpot_p95_ms: 50.0
  success_rate_min: 0.99

execution:
  repeats: 3
  cooldown_seconds: 10.0
  max_matrix_combinations: 16

output:
  save_prompts: false
  save_responses: false
  formats: [json, csv, markdown]
